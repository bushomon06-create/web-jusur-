<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="silverChrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgM)"/>
  <ellipse cx="200" cy="265" rx="135" ry="15" fill="#cbd5e1" opacity="0.6"/>

  <g transform="translate(15, 5)">
    <!-- Far Rear Wheel -->
    <circle cx="160" cy="185" r="62" fill="none" stroke="#94a3b8" stroke-width="4" opacity="0.5"/>
    <circle cx="160" cy="185" r="54" fill="none" stroke="#64748b" stroke-width="2" opacity="0.5"/>

    <!-- Seat & Backrest Upholstery -->
    <path d="M 130 90 L 140 180 L 220 180" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="125" y1="75" x2="132" y2="92" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/> <!-- Push Handle -->
    <rect x="120" y="70" width="16" height="8" rx="3" fill="#475569"/> <!-- Rubber Grip -->

    <!-- Main Chrome Frame -->
    <path d="M 130 90 L 142 195 L 225 195 L 245 240" fill="none" stroke="url(#silverChrome)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="142" y1="195" x2="175" y2="195" stroke="url(#silverChrome)" stroke-width="8"/>
    
    <!-- Armrest -->
    <path d="M 138 140 L 195 138" stroke="url(#silverChrome)" stroke-width="6" stroke-linecap="round"/>
    <rect x="145" y="132" width="46" height="8" rx="3" fill="#1e293b"/>

    <!-- Large Near Rear Wheel -->
    <!-- Black Tire -->
    <circle cx="155" cy="195" r="65" fill="none" stroke="#1e293b" stroke-width="9"/>
    <!-- Hand Rim (for self propulsion) -->
    <circle cx="155" cy="195" r="56" fill="none" stroke="url(#silverChrome)" stroke-width="4"/>
    <!-- Chrome Hub & Spokes -->
    <circle cx="155" cy="195" r="14" fill="url(#silverChrome)"/>
    <circle cx="155" cy="195" r="6" fill="#0f172a"/>
    <!-- Fine Spokes -->
    <g stroke="#cbd5e1" stroke-width="1.5">
      <line x1="155" y1="140" x2="155" y2="250"/>
      <line x1="100" y1="195" x2="210" y2="195"/>
      <line x1="116" y1="156" x2="194" y2="234"/>
      <line x1="116" y1="234" x2="194" y2="156"/>
      <line x1="134" y1="144" x2="176" y2="246"/>
      <line x1="134" y1="246" x2="176" y2="144"/>
      <line x1="104" y1="174" x2="206" y2="216"/>
      <line x1="104" y1="216" x2="206" y2="174"/>
    </g>
    <!-- Parking Hand Brake -->
    <rect x="202" y="172" width="8" height="16" rx="2" fill="#ef4444"/>
    <line x1="206" y1="175" x2="190" y2="188" stroke="#1e293b" stroke-width="4"/>

    <!-- Front Caster Wheel & Fork -->
    <path d="M 225 195 L 235 245" stroke="url(#silverChrome)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="235" cy="250" r="16" fill="#1e293b"/>
    <circle cx="235" cy="250" r="8" fill="url(#silverChrome)"/>

    <!-- Footplate -->
    <path d="M 225 195 L 255 245 L 278 245" fill="none" stroke="url(#silverChrome)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="258" y="242" width="26" height="6" rx="2" fill="#1e293b"/>

    <!-- Badge -->
    <g transform="translate(290, 30)">
      <rect width="70" height="24" rx="12" fill="#00507d" opacity="0.9"/>
      <text x="35" y="16" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">MANUAL</text>
    </g>
  </g>
</svg>