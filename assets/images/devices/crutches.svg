<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="alum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgC)"/>
  <ellipse cx="200" cy="270" rx="90" ry="12" fill="#cbd5e1" opacity="0.6"/>

  <!-- Left Crutch -->
  <g transform="rotate(-10 160 260)">
    <!-- Aluminum Shaft -->
    <line x1="160" y1="50" x2="160" y2="260" stroke="url(#alum)" stroke-width="8" stroke-linecap="round"/>
    <!-- Adjustment Push Pins -->
    <circle cx="160" cy="200" r="2.5" fill="#00507d"/>
    <circle cx="160" cy="215" r="2.5" fill="#00507d"/>
    <circle cx="160" cy="230" r="2.5" fill="#00507d"/>
    <!-- Rubber Ferrule / Tip -->
    <path d="M 153 252 L 167 252 L 170 268 L 150 268 Z" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Ergonomic Handgrip -->
    <rect x="160" y="130" width="42" height="14" rx="6" fill="#0f172a"/>
    <path d="M 160 137 L 198 137" stroke="#475569" stroke-width="2"/>
    <!-- Reflector on Handle -->
    <circle cx="160" cy="137" r="4" fill="#fbbf24"/>

    <!-- Forearm Arm Cuff (Open) -->
    <path d="M 135 60 C 135 35, 185 35, 185 60" fill="none" stroke="#00507d" stroke-width="12" stroke-linecap="round"/>
    <path d="M 160 52 L 160 70" stroke="url(#alum)" stroke-width="8"/>
  </g>

  <!-- Right Crutch -->
  <g transform="rotate(12 240 260)">
    <!-- Aluminum Shaft -->
    <line x1="240" y1="50" x2="240" y2="260" stroke="url(#alum)" stroke-width="8" stroke-linecap="round"/>
    <!-- Adjustment Push Pins -->
    <circle cx="240" cy="200" r="2.5" fill="#00507d"/>
    <circle cx="240" cy="215" r="2.5" fill="#00507d"/>
    <circle cx="240" cy="230" r="2.5" fill="#00507d"/>
    <!-- Rubber Ferrule / Tip -->
    <path d="M 233 252 L 247 252 L 250 268 L 230 268 Z" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Ergonomic Handgrip -->
    <rect x="200" y="130" width="42" height="14" rx="6" fill="#0f172a"/>
    <circle cx="240" cy="137" r="4" fill="#fbbf24"/>

    <!-- Forearm Arm Cuff (Open) -->
    <path d="M 215 60 C 215 35, 265 35, 265 60" fill="none" stroke="#00507d" stroke-width="12" stroke-linecap="round"/>
    <path d="M 240 52 L 240 70" stroke="url(#alum)" stroke-width="8"/>
  </g>

  <!-- Badge -->
  <g transform="translate(295, 30)">
    <rect width="65" height="24" rx="12" fill="#006a61" opacity="0.9"/>
    <text x="32" y="16" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">CRUTCHES</text>
  </g>
</svg>