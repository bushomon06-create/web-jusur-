<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00507d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bgG)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="200" cy="265" rx="140" ry="16" fill="#cbd5e1" opacity="0.6"/>
  
  <!-- Group in Center -->
  <g filter="url(#dropShadow)">
    <!-- Battery / Motor Housing Under Seat -->
    <rect x="150" y="175" width="75" height="45" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="156" y="183" width="22" height="12" rx="3" fill="#00a396"/>
    <circle cx="167" cy="189" r="2.5" fill="#ffffff"/>
    <rect x="186" y="183" width="30" height="6" rx="2" fill="#475569"/>

    <!-- Large Rear Drive Wheel (Left / Far) -->
    <circle cx="150" cy="215" r="48" fill="#1e293b"/>
    <circle cx="150" cy="215" r="34" fill="url(#metalGrad)" stroke="#334155" stroke-width="3"/>
    <circle cx="150" cy="215" r="14" fill="#00507d"/>
    <circle cx="150" cy="215" r="6" fill="#f8fafc"/>
    <!-- Wheel Spokes / Rim details -->
    <path d="M 150 181 L 150 249 M 116 215 L 184 215 M 126 191 L 174 239 M 126 239 L 174 191" stroke="#64748b" stroke-width="2.5"/>

    <!-- Tubular Frame -->
    <path d="M 135 150 L 165 175 L 235 175 L 255 220" fill="none" stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 140 85 L 155 175" fill="none" stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round"/>

    <!-- Padded Seat & Backrest -->
    <rect x="145" y="160" width="95" height="16" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="135" y="80" width="18" height="85" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2" transform="rotate(-6 135 80)"/>
    <rect x="130" y="60" width="22" height="24" rx="5" fill="#1e293b"/> <!-- Headrest -->

    <!-- Armrest & Joystick -->
    <path d="M 148 128 L 210 125" stroke="url(#frameGrad)" stroke-width="7" stroke-linecap="round"/>
    <rect x="170" y="120" width="48" height="10" rx="4" fill="#334155"/>
    <!-- Joystick Controller -->
    <rect x="212" y="115" width="16" height="18" rx="4" fill="#0f172a"/>
    <line x1="220" y1="115" x2="220" y2="103" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="220" cy="101" r="5" fill="#ef4444"/> <!-- Red Knob -->

    <!-- Front Caster Wheel & Fork -->
    <path d="M 235 175 L 245 235" stroke="url(#frameGrad)" stroke-width="7" stroke-linecap="round"/>
    <rect x="238" y="230" width="14" height="22" rx="4" fill="#64748b"/>
    <circle cx="245" cy="245" r="18" fill="#1e293b"/>
    <circle cx="245" cy="245" r="10" fill="url(#metalGrad)"/>
    <circle cx="245" cy="245" r="4" fill="#0f172a"/>

    <!-- Footrests -->
    <path d="M 235 175 L 265 225 L 290 225" fill="none" stroke="url(#metalGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="270" y="222" width="28" height="7" rx="3" fill="#1e293b"/>

    <!-- Medical Tech Badge -->
    <g transform="translate(305, 30)">
      <rect width="70" height="24" rx="12" fill="#00507d" opacity="0.9"/>
      <text x="35" y="16" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ELECTRIC</text>
    </g>
  </g>
</svg>