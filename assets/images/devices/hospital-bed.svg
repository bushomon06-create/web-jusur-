<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="mattressGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="bedFrame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgB)"/>
  <ellipse cx="200" cy="268" rx="150" ry="15" fill="#cbd5e1" opacity="0.6"/>

  <g transform="translate(25, 30)">
    <!-- Headboard (Elevated left) -->
    <rect x="35" y="75" width="14" height="115" rx="5" fill="#00507d" stroke="#003e61" stroke-width="2"/>
    <line x1="35" y1="95" x2="49" y2="95" stroke="#38bdf8" stroke-width="3"/>

    <!-- Footboard (Right) -->
    <rect x="305" y="110" width="14" height="80" rx="5" fill="#00507d" stroke="#003e61" stroke-width="2"/>

    <!-- Bed Base Heavy Steel Frame -->
    <rect x="45" y="165" width="265" height="16" rx="4" fill="url(#bedFrame)" stroke="#64748b" stroke-width="2"/>

    <!-- 4 Adjustable Electric Leg Posts with Caster Wheels -->
    <g stroke="url(#bedFrame)" stroke-width="8" stroke-linecap="round">
      <line x1="75" y1="180" x2="75" y2="225"/>
      <line x1="120" y1="180" x2="120" y2="225"/>
      <line x1="230" y1="180" x2="230" y2="225"/>
      <line x1="280" y1="180" x2="280" y2="225"/>
    </g>
    <!-- Caster Wheels with brakes -->
    <circle cx="75" cy="232" r="9" fill="#1e293b"/>
    <circle cx="120" cy="232" r="9" fill="#1e293b"/>
    <circle cx="230" cy="232" r="9" fill="#1e293b"/>
    <circle cx="280" cy="232" r="9" fill="#1e293b"/>

    <!-- Articulated 3-Section Mattress -->
    <!-- Backrest section (tilted up at 45 deg) -->
    <g transform="rotate(-30 135 160)">
      <rect x="50" y="145" width="90" height="18" rx="6" fill="url(#mattressGrad)" stroke="#0284c7" stroke-width="2"/>
      <!-- Pillow -->
      <rect x="54" y="136" width="30" height="12" rx="4" fill="#ffffff" opacity="0.9"/>
    </g>
    <!-- Flat pelvis section -->
    <rect x="135" y="147" width="55" height="18" rx="4" fill="url(#mattressGrad)"/>
    <!-- Knee elevation section -->
    <path d="M 190 165 L 235 148 L 295 165" fill="none" stroke="url(#mattressGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Collapsible Aluminum Safety Side Rails -->
    <g transform="translate(130, 115)">
      <line x1="0" y1="0" x2="110" y2="0" stroke="url(#bedFrame)" stroke-width="5" stroke-linecap="round"/>
      <line x1="0" y1="18" x2="110" y2="18" stroke="url(#bedFrame)" stroke-width="5" stroke-linecap="round"/>
      <line x1="15" y1="0" x2="15" y2="38" stroke="url(#bedFrame)" stroke-width="4"/>
      <line x1="55" y1="0" x2="55" y2="38" stroke="url(#bedFrame)" stroke-width="4"/>
      <line x1="95" y1="0" x2="95" y2="38" stroke="url(#bedFrame)" stroke-width="4"/>
    </g>

    <!-- Handheld Remote Pendant Control on coiled cord -->
    <path d="M 120 180 C 110 205, 95 210, 105 185" fill="none" stroke="#475569" stroke-width="2"/>
    <rect x="95" y="170" width="14" height="25" rx="3" fill="#ffffff" stroke="#00507d" stroke-width="1.5"/>
    <circle cx="102" cy="176" r="2" fill="#00a396"/>
    <circle cx="102" cy="183" r="2" fill="#ef4444"/>
  </g>

  <!-- Badge -->
  <g transform="translate(290, 25)">
    <rect width="80" height="24" rx="12" fill="#00507d" opacity="0.9"/>
    <text x="40" y="16" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">HOSPITAL BED</text>
  </g>
</svg>