<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="cellGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgA)"/>
  <ellipse cx="200" cy="265" rx="140" ry="16" fill="#cbd5e1" opacity="0.6"/>

  <g transform="translate(55, 60)">
    <!-- Base Mat Cushion -->
    <rect x="0" y="85" width="220" height="95" rx="14" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    
    <!-- Isometric Grid of Interconnected Flexible Air Cells (5x4) -->
    <!-- Row 1 -->
    <g transform="translate(15, 20)">
      <rect x="0" y="0" width="30" height="40" rx="8" fill="url(#cellGrad)" stroke="#64748b" stroke-width="1.5"/>
      <rect x="40" y="0" width="30" height="40" rx="8" fill="url(#cellGrad)" stroke="#64748b" stroke-width="1.5"/>
      <rect x="80" y="0" width="30" height="40" rx="8" fill="url(#cellGrad)" stroke="#64748b" stroke-width="1.5"/>
      <rect x="120" y="0" width="30" height="40" rx="8" fill="url(#cellGrad)" stroke="#64748b" stroke-width="1.5"/>
      <rect x="160" y="0" width="30" height="40" rx="8" fill="url(#cellGrad)" stroke="#64748b" stroke-width="1.5"/>
    </g>
    <!-- Row 2 -->
    <g transform="translate(15, 55)">
      <rect x="0" y="0" width="30" height="40" rx="8" fill="url(#cellGrad)" stroke="#64748b" stroke-width="1.5"/>
      <rect x="40" y="0" width="30" height="40" rx="8" fill="url(#cellGrad)" stroke="#64748b" stroke-width="1.5"/>
      <rect x="80" y="0" width="30" height="40" rx="8" fill="url(#cellGrad)" stroke="#64748b" stroke-width="1.5"/>
      <rect x="120" y="0" width="30" height="40" rx="8" fill="url(#cellGrad)" stroke="#64748b" stroke-width="1.5"/>
      <rect x="160" y="0" width="30" height="40" rx="8" fill="url(#cellGrad)" stroke="#64748b" stroke-width="1.5"/>
    </g>
    <!-- Row 3 -->
    <g transform="translate(15, 90)">
      <rect x="0" y="0" width="30" height="40" rx="8" fill="url(#cellGrad)" stroke="#64748b" stroke-width="1.5"/>
      <rect x="40" y="0" width="30" height="40" rx="8" fill="url(#cellGrad)" stroke="#64748b" stroke-width="1.5"/>
      <rect x="80" y="0" width="30" height="40" rx="8" fill="url(#cellGrad)" stroke="#64748b" stroke-width="1.5"/>
      <rect x="120" y="0" width="30" height="40" rx="8" fill="url(#cellGrad)" stroke="#64748b" stroke-width="1.5"/>
      <rect x="160" y="0" width="30" height="40" rx="8" fill="url(#cellGrad)" stroke="#64748b" stroke-width="1.5"/>
    </g>
    <!-- Row 4 -->
    <g transform="translate(15, 125)">
      <rect x="0" y="0" width="30" height="38" rx="8" fill="url(#cellGrad)" stroke="#64748b" stroke-width="1.5"/>
      <rect x="40" y="0" width="30" height="38" rx="8" fill="url(#cellGrad)" stroke="#64748b" stroke-width="1.5"/>
      <rect x="80" y="0" width="30" height="38" rx="8" fill="url(#cellGrad)" stroke="#64748b" stroke-width="1.5"/>
      <rect x="120" y="0" width="30" height="38" rx="8" fill="url(#cellGrad)" stroke="#64748b" stroke-width="1.5"/>
      <rect x="160" y="0" width="30" height="38" rx="8" fill="url(#cellGrad)" stroke="#64748b" stroke-width="1.5"/>
    </g>

    <!-- Brass Air Valve -->
    <rect x="-14" y="145" width="16" height="10" rx="2" fill="#eab308"/>
    <circle cx="-14" cy="150" r="4" fill="#ca8a04"/>

    <!-- Air Tube & Hand Pump -->
    <path d="M -14 150 C -40 150, -35 80, 235 60" fill="none" stroke="#94a3b8" stroke-width="4"/>
    <!-- Yellow / Black Hand Pump Bulb -->
    <g transform="translate(235, 45) rotate(15)">
      <rect x="0" y="8" width="45" height="24" rx="12" fill="#00507d"/>
      <rect x="42" y="14" width="12" height="12" rx="3" fill="#cbd5e1"/>
      <circle cx="5" cy="20" r="4" fill="#00a396"/>
    </g>
  </g>

  <!-- Badge -->
  <g transform="translate(285, 25)">
    <rect width="80" height="24" rx="12" fill="#006a61" opacity="0.9"/>
    <text x="40" y="16" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">AIR CUSHION</text>
  </g>
</svg>