<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgK" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="neoprene" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="hingeSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgK)"/>
  <ellipse cx="200" cy="270" rx="90" ry="12" fill="#cbd5e1" opacity="0.6"/>

  <g transform="translate(130, 25)">
    <!-- Main Neoprene Sleeve Contour -->
    <path d="M 20 15 L 120 15 L 110 245 L 30 245 Z" fill="url(#neoprene)" stroke="#475569" stroke-width="2"/>
    
    <!-- Open Patella Donut Ring with Gel Padding -->
    <circle cx="70" cy="130" r="26" fill="#0284c7" opacity="0.3"/>
    <circle cx="70" cy="130" r="20" fill="none" stroke="#0284c7" stroke-width="7"/>
    <circle cx="70" cy="130" r="12" fill="#f8fafc"/>

    <!-- Bilateral Aluminum Polycentric Hinges (Left & Right) -->
    <!-- Left Hinge Bar -->
    <line x1="22" y1="35" x2="22" y2="225" stroke="url(#hingeSteel)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="22" cy="130" r="10" fill="#0f172a" stroke="url(#hingeSteel)" stroke-width="3"/>
    <circle cx="22" cy="130" r="4" fill="#00a396"/>

    <!-- Right Hinge Bar -->
    <line x1="118" y1="35" x2="118" y2="225" stroke="url(#hingeSteel)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="118" cy="130" r="10" fill="#0f172a" stroke="url(#hingeSteel)" stroke-width="3"/>
    <circle cx="118" cy="130" r="4" fill="#00a396"/>

    <!-- 4 Adjustable Hook-and-Loop Velcro Straps with Buckles -->
    <!-- Strap 1 (Thigh Top) -->
    <rect x="10" y="38" width="120" height="16" rx="4" fill="#00507d" stroke="#003e61" stroke-width="1.5"/>
    <rect x="115" y="36" width="12" height="20" rx="3" fill="#cbd5e1"/>
    
    <!-- Strap 2 (Thigh Lower) -->
    <rect x="12" y="80" width="116" height="16" rx="4" fill="#00507d" stroke="#003e61" stroke-width="1.5"/>
    <rect x="113" y="78" width="12" height="20" rx="3" fill="#cbd5e1"/>

    <!-- Strap 3 (Calf Upper) -->
    <rect x="14" y="165" width="112" height="16" rx="4" fill="#00507d" stroke="#003e61" stroke-width="1.5"/>
    <rect x="111" y="163" width="12" height="20" rx="3" fill="#cbd5e1"/>

    <!-- Strap 4 (Calf Lower) -->
    <rect x="16" y="205" width="108" height="16" rx="4" fill="#00507d" stroke="#003e61" stroke-width="1.5"/>
    <rect x="109" y="203" width="12" height="20" rx="3" fill="#cbd5e1"/>

    <!-- Breathable Mesh Details -->
    <g fill="#64748b" opacity="0.5">
      <circle cx="50" cy="115" r="1.5"/><circle cx="55" cy="115" r="1.5"/><circle cx="60" cy="115" r="1.5"/>
      <circle cx="80" cy="115" r="1.5"/><circle cx="85" cy="115" r="1.5"/><circle cx="90" cy="115" r="1.5"/>
      <circle cx="50" cy="145" r="1.5"/><circle cx="55" cy="145" r="1.5"/><circle cx="60" cy="145" r="1.5"/>
      <circle cx="80" cy="145" r="1.5"/><circle cx="85" cy="145" r="1.5"/><circle cx="90" cy="145" r="1.5"/>
    </g>
  </g>

  <!-- Badge -->
  <g transform="translate(290, 25)">
    <rect width="80" height="24" rx="12" fill="#00507d" opacity="0.9"/>
    <text x="40" y="16" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">KNEE BRACE</text>
  </g>
</svg>