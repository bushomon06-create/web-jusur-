<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="lcdGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgT)"/>
  <ellipse cx="200" cy="270" rx="120" ry="14" fill="#cbd5e1" opacity="0.6"/>

  <!-- TENS Device Body -->
  <g transform="translate(85, 35)">
    <rect width="130" height="210" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.08))"/>
    <rect x="5" y="5" width="120" height="200" rx="16" fill="#f8fafc"/>

    <!-- Rubber Grip Edges -->
    <path d="M 3 45 Q 0 95 3 145" stroke="#00507d" stroke-width="6" stroke-linecap="round"/>
    <path d="M 127 45 Q 130 95 127 145" stroke="#00507d" stroke-width="6" stroke-linecap="round"/>

    <!-- Top Output Jacks -->
    <rect x="25" y="-6" width="22" height="9" rx="3" fill="#334155"/>
    <circle cx="36" cy="-2" r="3" fill="#0f172a"/>
    <rect x="83" y="-6" width="22" height="9" rx="3" fill="#334155"/>
    <circle cx="94" cy="-2" r="3" fill="#0f172a"/>

    <!-- LCD Screen -->
    <rect x="15" y="20" width="100" height="75" rx="8" fill="url(#lcdGrad)"/>
    <rect x="18" y="23" width="94" height="69" rx="6" fill="#0284c7" opacity="0.4"/>
    
    <!-- Screen Elements: Pulse Wave & Timer -->
    <text x="24" y="40" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">CH1: TENS</text>
    <text x="82" y="40" fill="#a7f3d0" font-family="monospace" font-size="11" font-weight="bold">20m</text>
    <path d="M 24 60 L 38 60 L 44 48 L 50 72 L 56 60 L 70 60 L 76 52 L 82 68 L 88 60 L 105 60" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <text x="24" y="82" fill="#ffffff" font-family="monospace" font-size="9">PULSE: 80Hz</text>
    <text x="82" y="82" fill="#ffffff" font-family="monospace" font-size="9">INT: 12</text>

    <!-- Keypad / Control Buttons -->
    <circle cx="65" cy="120" r="16" fill="#00507d"/>
    <path d="M 65 112 L 65 128 M 57 120 L 73 120" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/> <!-- Set button -->

    <circle cx="35" cy="155" r="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="35" y="160" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">▲</text>

    <circle cx="35" cy="185" r="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="35" y="190" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">▼</text>

    <circle cx="95" cy="155" r="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="95" y="160" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">▲</text>

    <circle cx="95" cy="185" r="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="95" y="190" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">▼</text>

    <rect x="52" y="165" width="26" height="14" rx="4" fill="#006a61"/>
    <text x="65" y="175" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">MODE</text>
  </g>

  <!-- Output Wires & Electrode Pads -->
  <!-- Cable 1 -->
  <path d="M 121 35 C 130 -10, 260 20, 270 80" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <!-- Electrode Pad 1 -->
  <g transform="translate(260, 75)">
    <rect width="48" height="48" rx="8" fill="#ffffff" stroke="#00507d" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))"/>
    <circle cx="24" cy="24" r="14" fill="#e2e8f0"/>
    <circle cx="24" cy="24" r="6" fill="#00507d"/>
  </g>

  <!-- Cable 2 -->
  <path d="M 179 35 C 200 -10, 310 60, 320 145" fill="none" stroke="#00a396" stroke-width="2.5"/>
  <!-- Electrode Pad 2 -->
  <g transform="translate(305, 140)">
    <rect width="48" height="48" rx="8" fill="#ffffff" stroke="#00a396" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))"/>
    <circle cx="24" cy="24" r="14" fill="#e2e8f0"/>
    <circle cx="24" cy="24" r="6" fill="#00a396"/>
  </g>

  <!-- Badge -->
  <g transform="translate(295, 25)">
    <rect width="70" height="24" rx="12" fill="#00507d" opacity="0.9"/>
    <text x="35" y="16" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">TENS/EMS</text>
  </g>
</svg>